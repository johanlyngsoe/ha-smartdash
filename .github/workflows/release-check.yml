name: SmartDash code checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check JavaScript syntax
        run: find js admin -type f -name '*.js' -exec node --check {} +
      - name: Check PHP syntax
        run: find api -type f -name '*.php' -exec php -l {} +
      - name: Check JSON syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for folder in ('data',):
              for file in Path(folder).rglob('*.json'):
                  json.loads(file.read_text(encoding='utf-8'))
                  print(f'Valid JSON: {file}')
          PY
